<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0c0b0a"/>

  <!-- AppKINGS crown, scaled from the 100x100 mark -->
  <g transform="translate(60 96) scale(1.5)" fill="none" stroke="#ff4d1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 40 24 78 36 52 50 80 64 52 76 78 92 40"/>
    <path d="M8 40 30 66 50 40 70 66 92 40"/>
  </g>
  <g transform="translate(60 96) scale(1.5)" fill="#ff4d1c">
    <path d="M50 4 57 15 50 26 43 15Z"/>
    <circle cx="30" cy="66" r="3.4"/>
    <circle cx="70" cy="66" r="3.4"/>
    <circle cx="8" cy="40" r="4.6"/>
    <circle cx="92" cy="40" r="4.6"/>
  </g>

  <!-- Wordmark: "App" light, "KINGS" heavy, as in the logo -->
  <text x="250" y="200" font-family="system-ui, 'Segoe UI', sans-serif" font-size="104" fill="#f4f1ec">
    <tspan font-weight="400">App</tspan><tspan font-weight="800">KINGS</tspan>
  </text>

  <!-- Four-colour bar + SOLUTIONS -->
  <g>
    <rect x="252" y="228" width="46" height="22" rx="3" fill="#f5b400"/>
    <rect x="306" y="228" width="46" height="22" rx="3" fill="#e8401c"/>
    <rect x="360" y="228" width="46" height="22" rx="3" fill="#7ab800"/>
    <rect x="414" y="228" width="46" height="22" rx="3" fill="#1a9ad6"/>
  </g>
  <text x="480" y="248" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#ff4d1c">SOLUTIONS</text>

  <!-- Tagline -->
  <text x="252" y="300" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-style="italic" fill="#9b958d">Viable enterprise solutions</text>

  <!-- Product line -->
  <text x="60" y="470" font-family="system-ui, 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#f4f1ec">Drill Lyrics</text>
  <text x="60" y="530" font-family="system-ui, 'Segoe UI', sans-serif" font-size="34" fill="#9b958d">Read the bars while the music plays.</text>
  <text x="60" y="580" font-family="system-ui, 'Segoe UI', sans-serif" font-size="28" fill="#ff4d1c">Kenyan drill · one track at a time</text>

  <!-- Accent strip in the brand's four colours -->
  <g>
    <rect x="0" y="606" width="300" height="24" fill="#f5b400"/>
    <rect x="300" y="606" width="300" height="24" fill="#e8401c"/>
    <rect x="600" y="606" width="300" height="24" fill="#7ab800"/>
    <rect x="900" y="606" width="300" height="24" fill="#1a9ad6"/>
  </g>
</svg>
