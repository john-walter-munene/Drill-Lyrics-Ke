# Full local stack: Postgres + Redis + API + Web.
# From the repo root:
#   npm run stack:up     (docker compose -f infra/docker-compose.full.yml up --build)
#   npm run stack:down
#
# The base infra (Postgres + Redis) is reused from docker-compose.yml, so the
# ports and volume names never diverge between the two files.

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drillke-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://drillke:drillke@postgres:5432/drillke?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production-000000000000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Run the metadata importer inside the API (free-tier staging default).
      EMBED_WORKER: ${EMBED_WORKER:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: drillke-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
