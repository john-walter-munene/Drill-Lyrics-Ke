# ─── DrillKe — the whole app in TWO containers ──────────────────────────────
#
#   docker compose up -d --build     start (build the first time)
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop and wipe data + build cache
#
# Containers (visible in Docker Desktop under the `drill-lyrics-key` project):
#
#   drill-lyrics-key-api   backend: NestJS API + PostgreSQL 16 in ONE container
#                          → http://localhost:4000/api/health/ready
#                          → Postgres also reachable from the host on :5432
#   drill-lyrics-key-web   frontend: Next.js production build
#                          → http://localhost:3000
#
# The database runs inside the backend container on purpose: it keeps the stack
# to two containers and makes `docker compose up` self-initialising (the
# entrypoint creates the data dir, applies migrations and seeds). Database data
# persists in the `pgdata` volume across restarts.
#
# Point compose at this file explicitly when running from the repo root:
#   docker compose -f infra/docker-compose.yml up -d --build
# (from inside infra/ the plain `docker compose up` form works too).
#
# Configuration: ONE env file, `../.env` at the repo root (copy it from
# .env.example). It is passed to the api container via `env_file`, and the
# ${VAR:-default} lines below read it because the root package.json sits next
# to it. Setting a value there takes a re-created container to apply:
#   docker compose -f infra/docker-compose.yml up -d

name: drill-lyrics-key

services:
  # ── Backend: API + database ──────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: drillke-api:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # The API talks to the PostgreSQL server inside this same container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-drillke}:${POSTGRES_PASSWORD:-drillke}@localhost:5432/${POSTGRES_DB:-drillke}?schema=public
      POSTGRES_DB: ${POSTGRES_DB:-drillke}
      POSTGRES_USER: ${POSTGRES_USER:-drillke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drillke}
      # Schema is applied by the entrypoint; set to false to skip seeding.
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@drillke.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      SEED_ADMIN_RESET_PASSWORD: ${SEED_ADMIN_RESET_PASSWORD:-false}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-before-deploying-0000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-512kb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMBED_WORKER: ${EMBED_WORKER:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Mail (review outcomes, password reset, account deletion). `mock` is a
      # valid production setting; it logs instead of sending. `smtp` with an
      # incomplete configuration fails the boot-time env check on purpose.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-DrillKe <no-reply@drillke.com>}
      # Used for the links inside those emails; must be the real public origin
      # in production, not localhost.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"   # API
      - "${DB_PORT:-5432}:5432"    # PostgreSQL (psql, Prisma Studio, etc.)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── Frontend: Next.js production build ───────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: drillke-web:latest
    restart: unless-stopped
    env_file:
      - ../.env
    # The image is built with `output: 'standalone'`, which emits its own
    # `server.js` AND strips the npm tree (no node_modules/.bin). So the start
    # command is pinned here rather than using the image's default: `next start`
    # refuses to run against standalone output, and the image has no root script
    # to fall back to. Without this the container restarts in a loop.
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
