# ─── DrillKe — DEVELOPMENT stack (hot reload) ──────────────────────────────
#
#   npm run dev:stack          build + start, follow logs (Ctrl+C stops)
#   npm run dev:stack:bg       build + start in the background
#   npm run dev:stack:down     stop (database data is kept)
#   npm run dev:stack:logs     tail api + web
#   npm run dev:stack:reset    stop and wipe the database
#
#   Two long-running containers (same shape as production):
#
#     drill-lyrics-key-dev-api   NestJS API  +  PostgreSQL 16  → http://localhost:4000
#     drill-lyrics-key-dev-web   Next.js dev server            → http://localhost:3000
#
#   One one-shot job runs first and exits:
#
#     install   `npm ci` into a shared volume (only when manifests change)
#
#   Migrations and seeding happen inside the `api` container via the same
#   entrypoint production uses, so the dev database always matches prod.
#
# HOW HOT RELOAD WORKS
#   The repo is bind-mounted at /app, so the container sees your edits
#   immediately. `node_modules` and `dist`/`.next` live in named volumes, so the
#   Linux-built dependencies are never overwritten by the host's.
#   * api → `npm run start:dev` = tsc --watch + node, restarts on every change
#   * web → `next dev`, recompiles on every change
#   Polling is enabled (CHOKIDAR_USEPOLLING / WATCHPACK_POLLING) because bind
#   mounts on Windows and macOS do not emit native file-system events.
#
# ISOLATION
#   Project name is pinned to `drill-lyrics-key-dev`, so containers, networks
#   and volumes are namespaced and cannot collide with the production stack
#   (`drill-lyrics-key`) or any other checkout.
#
# CONFIGURATION
#   One env file: `../../.env` at the repo root (copy it from .env.example).
#   The `env_file` below is what actually feeds the api container, so it works
#   the same whether you run compose via `npm run dev:stack` or by hand with
#   `-f infra/docker-compose.dev.yml`. The `${VAR:-default}` lines still read
#   the same file, because the root package.json sits beside it.
#
# CHANGED A VALUE?  `npm run dev:stack:restart` — environment is fixed at
# container creation, so a restart of the process is not enough.

name: drill-lyrics-key-dev

x-dev-base: &dev-base
  build:
    context: ..
    dockerfile: infra/Dockerfile.dev
  image: drillke-dev:latest
  volumes:
    - ..:/app
    - node_modules:/app/node_modules

services:
  # ── One-shot: install dependencies into the shared volume ────────────────
  #
  # The install must still run on every `up`, because the named node_modules
  # volume may be empty (fresh clone) — but it must never be the reason the
  # STACK will not start:
  #
  #   * `restart: "no"` + a container that exits 0 keeps a record behind, which
  #     is what makes Docker Desktop's Start button find it at all. Compose's
  #     `start` re-starts EXISTING containers only (it never recreates), so if
  #     this container were removed, `depends_on: install` in `api` would fail
  #     with "api is missing dependency install" and Start would exit 1.
  #   * `init: true` is NOT cosmetic here. Docker Desktop's Start runs an exec
  #     against every container in the project. Without an init process nothing
  #     reaps the exited install's child, so that exec hangs and Start aborts
  #     with "context canceled". tini reaps and exits cleanly.
  #
  # Dependencies are installed only when the manifests changed, so a Start on a
  # prepared volume costs a stamp comparison.
  install:
    <<: *dev-base
    working_dir: /app
    restart: "no"
    init: true
    environment:
      NODE_ENV: development
    command:
      - sh
      - -c
      - |
        mkdir -p node_modules
        stamp="node_modules/.drillke-stamp"
        if [ ! -f package-lock.json ]; then
          echo "[install] WARNING: package-lock.json missing — run npm install on the host first" >&2
          exit 1
        fi
        new_hash="$$(cat package-lock.json package.json apps/api/package.json apps/web/package.json packages/shared/package.json prisma/schema.prisma | sha256sum | cut -d' ' -f1)"
        old_hash="$$(cat "$$stamp" 2>/dev/null || true)"
        if [ "$$old_hash" = "$$new_hash" ] && [ -d node_modules/@drillke ]; then
          echo "[install] dependencies up to date"
          exit 0
        fi
        echo "[install] npm ci ..."
        if npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000; then
          npx prisma generate --schema prisma/schema.prisma && npm run build -w @drillke/shared
        else
          # A half-installed volume is worse than none: api/web would start
          # against a partial tree and die on an unrelated "Cannot find module".
          # Say what happened and leave the stamp unset so the next start retries.
          echo "[install] FAILED: could not install dependencies (network? registry auth?)." >&2
          echo "[install] Fix the cause, then: npm run dev:stack:install" >&2
          exit 1
        fi
        echo "$$new_hash" > "$$stamp"
        echo "[install] ready"

  # ── Backend: API + PostgreSQL (hot reload) ───────────────────────────────
  api:
    <<: *dev-base
    init: true
    # The dev image ships PostgreSQL too, so the topology matches production.
    # Reuse the production entrypoint to init + start the database.
    container_name: drill-lyrics-key-dev-api
    # Run from the repo root: the entrypoint resolves prisma/schema.prisma and
    # package scripts relative to /app.
    working_dir: /app
    entrypoint: ["/app/infra/docker-entrypoint.sh"]
    command: ["npm", "run", "start:dev", "--prefix", "apps/api"]
    # Values not already set below come from the root .env. The explicit
    # `environment` block wins over env_file, and carries the compose-network
    # defaults (DATABASE_URL to localhost inside the container).
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: "4000"
      # Postgres server binaries live in a versioned dir that is not on PATH.
      # (Compose merges env over the image's ENV, so re-declare it here.)
      PATH: /usr/lib/postgresql/16/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: postgresql://${POSTGRES_USER:-drillke}:${POSTGRES_PASSWORD:-drillke}@localhost:5432/${POSTGRES_DB:-drillke}?schema=public
      POSTGRES_DB: ${POSTGRES_DB:-drillke}
      POSTGRES_USER: ${POSTGRES_USER:-drillke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drillke}
      # Migrations are applied once by the entrypoint on boot; the `migrate`
      # job is kept as a convenience for re-seeding without a restart.
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@drillke.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      # Without this, an existing admin row is never updated and a password
      # changed in infra/.env is silently ignored. In dev the operator owns
      # the database, so following the env file IS the intended reset.
      SEED_ADMIN_RESET_PASSWORD: ${SEED_ADMIN_RESET_PASSWORD:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-before-deploying-0000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      EMBED_WORKER: ${EMBED_WORKER:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Mail: `mock` logs instead of sending. Set MAIL_PROVIDER=smtp plus the
      # SMTP_* / MAIL_FROM values in infra/.env to send for real.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-DrillKe <no-reply@drillke.local>}
      # Password-reset links and account emails point at the public site.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${API_PORT:-4000}:4000"
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Frontend: Next.js dev server (hot reload) ────────────────────────────
  web:
    <<: *dev-base
    init: true
    container_name: drill-lyrics-key-dev-web
    working_dir: /app/apps/web
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      # Keep the compiled output out of the bind mount (Linux-native + fast).
      - next_cache:/app/apps/web/.next
    depends_on:
      install:
        condition: service_completed_successfully
      # The web server renders pages server-side from the API. Without this, a
      # Start on a stopped stack boots web first, every request logs
      # `connect ECONNREFUSED api:4000`, and the page shows an error until the
      # API catches up.
      api:
        condition: service_healthy
    command: ["npx", "next", "dev", "-p", "3000", "-H", "0.0.0.0"]

volumes:
  node_modules:
  next_cache:
