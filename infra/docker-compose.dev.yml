# ─── DrillKe — DEVELOPMENT stack (hot reload, isolated from your machine) ───
#
#   npm run dev:stack          # first run installs deps inside the container
#   npm run dev:stack:down     # stop (keeps volumes/data)
#   npm run dev:stack:reset    # stop and wipe node_modules + database
#   npm run dev:logs
#
# URLs:  web http://localhost:3000   ·   api http://localhost:4000/api/health/ready
#
# ISOLATION — nothing here touches other local projects:
#   * The compose project name is pinned to `drillke-dev`, so containers,
#     networks and volumes are namespaced `drillke-dev_*` and can never collide
#     with another checkout or another app.
#   * Host ports are overridable via .env.local (WEB_PORT / API_PORT / DB_PORT),
#     so a port clash is solved by changing one variable, not by editing code.
#   * Only source files are bind-mounted. `node_modules` live in a Docker named
#     volume and Postgres data in another, so the app is installed and built by
#     Linux inside the container, not by your host OS.
#   * The app runs as the non-root `node` user.
#
# NOTE: the `api` and `web` services are behind the `dev` profile so the
# one-shot `install`/`migrate` jobs can run first (`npm run dev:bootstrap`).
# `npm run dev:stack` starts everything, including the profile.

name: drillke-dev

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drillke
      POSTGRES_PASSWORD: drillke
      POSTGRES_DB: drillke
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillke -d drillke"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Cache / rate-limit store (reserved) ───────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot: install deps inside the container, generate Prisma client ───
  # Runs `npm ci` only when the install stamp is missing or manifests changed.
  install:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    image: drillke-dev-base:latest
    user: "root"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p node_modules
        chown -R node:node /app/node_modules 2>/dev/null || true
        stamp="node_modules/.drillke-install-stamp"
        new_hash="$$(cat package-lock.json apps/api/package.json apps/web/package.json packages/shared/package.json | sha256sum | cut -d' ' -f1)"
        old_hash="$$(cat "$$stamp" 2>/dev/null || true)"
        if [ "$$old_hash" = "$$new_hash" ] && [ -d node_modules/@drillke ]; then
          echo "Dependencies up to date."
          chown -R node:node /app/node_modules
          exit 0
        fi
        echo "Installing dependencies (npm ci)..."
        npm ci --no-audit --no-fund
        npx prisma generate --schema prisma/schema.prisma
        npm run build -w @drillke/shared
        echo "$$new_hash" > "$$stamp"
        chown -R node:node /app/node_modules
        echo "Dependencies ready."

  # ── Migrations + seed ─────────────────────────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    user: "root"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://drillke:drillke@db:5432/drillke?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@drillke.local}
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        if [ $$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l) -eq 0 ]; then
          echo "No migration yet — generating the baseline schema migration."
          npx prisma migrate dev --name init --schema prisma/schema.prisma --skip-seed
        else
          npx prisma migrate deploy --schema prisma/schema.prisma
        fi
        npm run db:seed

  # ── API (hot reload via tsx watch) ────────────────────────────────────────
  api:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://drillke:drillke@db:5432/drillke?schema=public
      REDIS_URL: redis://cache:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-0123456789abcdef}
      EMBED_WORKER: "false"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    working_dir: /app/apps/api
    command: ["npx", "tsx", "watch", "--clear-screen=false", "src/main.ts"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Web (Next.js dev server, HMR) ─────────────────────────────────────────
  web:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - next_cache:/app/apps/web/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Browser-reachable API URL (baked into the client bundle).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    working_dir: /app/apps/web
    command: ["npx", "next", "dev", "-p", "3000", "-H", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  redisdata:
  node_modules:
  next_cache:
