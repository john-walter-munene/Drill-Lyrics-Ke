name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` fails fast if package-lock.json is out of sync with any
      # package.json — e.g. a dep was added without running `npm install`.
      # --ignore-scripts keeps this quick (no Prisma engine download).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package-lock.json is in sync
        run: npm ci --ignore-scripts --no-audit --no-fund

  shared:
    name: Shared engine (lyrics logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pure-logic tests (timestamp parsing, active-line lookup) run on Node's
      # native TS type-stripping — no build step needed.
      - name: Install workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm run test:shared

  build:
    name: Install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build

  audit:
    name: Dependency audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit dependencies
        run: npm audit --audit-level=high || (echo "Review new high/critical advisories before merging" && exit 1)

  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t drillke-api:${{ github.sha }} .
      # Fail on fixable HIGH/CRITICAL OS/library vulnerabilities in the image.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: drillke-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
